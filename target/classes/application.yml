spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/benchmarkdb
    username: postgres
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: BenchmarkHikariPool

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus

      metrics:
        tags:
          application: virtual-thread-benchmark